# ============================================
# MS-ECOMMERCE - PRODUCTION CONFIGURATION
# ============================================
quarkus:
  application:
    name: ms-ecommerce
    version: 1.0.0-SNAPSHOT

  # ============================================
  # HTTP SERVER
  # ============================================
  http:
    port: 8080
    http2: true
    host: 0.0.0.0
    cors:
      origins: "*"
      methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      headers: accept,authorization,content-type,x-requested-with,x-request-id,x-correlation-id
      exposed-headers: x-request-id,x-correlation-id
      access-control-max-age: 24H
    limits:
      max-body-size: 10M
      max-header-size: 20K
      max-chunk-size: 8K
    enable-compression: true
    compression-level: 6
    idle-timeout: 30M
    read-timeout: 60s
    body:
      handle-file-uploads: true
      uploads-directory: /tmp/uploads
      delete-uploaded-files-on-end: true

  # ============================================
  # LOGGING
  # ============================================
  log:
    level: INFO
    min-level: DEBUG
    console:
      enable: true
      json: true
      color: false
    category:
      "com.jonavcar.ecommerce":
        level: INFO
      "com.jonavcar.ecommerce.sales":
        level: INFO
      "org.apache.kafka":
        level: WARN
      "io.quarkus":
        level: INFO
      "io.vertx":
        level: WARN
      "org.hibernate.validator":
        level: INFO
      "io.smallrye":
        level: INFO
      "org.jboss":
        level: WARN

  # ============================================
  # OPENAPI / SWAGGER
  # ============================================
  smallrye-openapi:
    path: /q/openapi
    info-title: E-Commerce Sales API
    info-version: 1.0.0
    info-description: Microservicio de ventas con integracion Kafka Redis y servicios externos
    info-contact-name: Jonavcar Development Team
    info-contact-email: dev@jonavcar.com
    info-contact-url: https://jonavcar.com
    info-license-name: Apache 2.0
    info-license-url: https://www.apache.org/licenses/LICENSE-2.0.html
    enable: true

  swagger-ui:
    enable: false
    always-include: false
    path: /q/swagger-ui

  # ============================================
  # KAFKA
  # ============================================
  kafka:
    devservices:
      enabled: false
    bootstrap-servers: localhost:9092
    health:
      enabled: true
    snappy:
      enabled: true

  # ============================================
  # REDIS
  # ============================================
  redis:
    devservices:
      enabled: false
    hosts: redis://localhost:6379
    database: 0
    client-type: standalone
    timeout: 10s
    max-pool-size: 50
    max-pool-waiting: 50
    reconnect-attempts: 10
    reconnect-interval: 1s
    tcp-keep-alive: true
    tcp-no-delay: true
    health:
      enabled: true
    client-name: ms-ecommerce-sales

  # ============================================
  # CACHE
  # ============================================
  cache:
    enabled: true
    type: redis

  # ============================================
  # REST CLIENT
  # ============================================
  rest-client:
    "com.jonavcar.ecommerce.sales.proxy.DefaultApi":
      url: http://localhost:8081
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
      providers: com.jonavcar.ecommerce.sales.exception.ApiExceptionMapper

    "com.jonavcar.ecommerce.sales.proxy.ProductApi":
      url: http://localhost:8082
      scope: jakarta.inject.Singleton
      connect-timeout: 10000
      read-timeout: 30000
      providers: com.jonavcar.ecommerce.sales.exception.ApiExceptionMapper

  # ============================================
  # FAULT TOLERANCE
  # ============================================
  smallrye-faulttolerance:
    enabled: true
    mp-metrics:
      enabled: true

  # ============================================
  # Configuración específica de Apicurio Registry
  # ============================================
  apicurio-registry:
    devservices:
      enabled: false

  # ============================================
  # VAULT
  # ============================================
  vault:
    devservices:
      enabled: false
    url: http://localhost:8200
    authentication:
      client-token: dev-only-token
    kv-secret-engine-version: 2
    secret-config-kv-path: ms-ecommerce/prod

  # ============================================
  # HEALTH CHECKS
  # ============================================
  smallrye-health:
    root-path: /q/health
    liveness-path: /q/health/live
    readiness-path: /q/health/ready

  # ============================================
  # METRICS
  # ============================================
  micrometer:
    enabled: true
    export:
      prometheus:
        enabled: true
        path: /q/metrics

  # ============================================
  # TRACING
  # ============================================
  otel:
    sdk:
      disabled: false
    service:
      name: ms-ecommerce-sales
      version: 1.0.0

  # ============================================
  # THREADS
  # ============================================
  thread-pool:
    core-threads: 1
    max-threads: 200

  virtual-threads:
    enabled: true

  # ============================================
  # PACKAGE
  # ============================================
  package:
    jar:
      enabled: true
      type: fast-jar
      compress: true
      add-runner-suffix: true
      manifest:
        add-implementation-entries: true
        attributes:
          Built-By: Jonavcar CICD
      user-configured-ignored-entries:
        - META-INF/MANIFEST.MF

  # ============================================
  # JACKSON
  # ============================================
  jackson:
    fail-on-unknown-properties: false
    write-dates-as-timestamps: false
    timezone: UTC
    serialization-inclusion: non-null

# ============================================
# KAFKA CHANNELS
# ============================================
mp:
  messaging:
    outgoing:
      sales-orders-out:
        connector: smallrye-kafka
        topic: sales.orders.events.v1
        acks: all
        retries: 2147483647
        enable-idempotence: true
        compression-type: snappy
        batch-size: 32768

      sales-payments-out:
        connector: smallrye-kafka
        topic: sales.payments.events.v1
        acks: all
        enable-idempotence: true
        compression-type: snappy

    incoming:
      product-updates-in:
        connector: smallrye-kafka
        topic: product.updates.events.v1
        group:
          id: ms-ecommerce-sales-group
        enable:
          auto:
            commit: false
        max-poll-records: 500

      inventory-updates-in:
        connector: smallrye-kafka
        topic: inventory.updates.events.v1
        group:
          id: ms-ecommerce-sales-group
        enable:
          auto:
            commit: false

# ============================================
# SCHEMA REGISTRY
# ============================================
kafka:
  schema:
    registry:
      url: http://localhost:8081

# ============================================
# CUSTOM PROPERTIES
# ============================================
app:
  name: MS E-Commerce Sales
  version: 1.0.0-SNAPSHOT
  environment: production
  business:
    max-order-items: 100
    currency: USD
    tax-rate: 0.18
